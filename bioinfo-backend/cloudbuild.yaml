# Google Cloud Build configuration for deploying to Cloud Run
# This file automates building and deploying the FastAPI backend

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
    id: 'push-image'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
    id: 'push-latest-tag'

  # Step 3: Run database migrations via Cloud Run Jobs (before deploying new code)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        if gcloud run jobs describe db-migrate --region=${_REGION} --quiet 2>/dev/null; then
          gcloud run jobs update db-migrate \
            --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID \
            --region=${_REGION} \
            --set-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE} \
            --set-secrets=DATABASE_URL=database-url:latest \
            --command=alembic \
            --args=upgrade,head \
            --max-retries=0 \
            --task-timeout=120 \
            --quiet
        else
          gcloud run jobs create db-migrate \
            --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID \
            --region=${_REGION} \
            --set-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE} \
            --set-secrets=DATABASE_URL=database-url:latest \
            --command=alembic \
            --args=upgrade,head \
            --max-retries=0 \
            --task-timeout=120 \
            --quiet
        fi
        gcloud run jobs execute db-migrate --region=${_REGION} --wait
    id: 'run-migrations'
    waitFor: ['push-image', 'push-latest-tag']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--concurrency=80'
      - '--add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE}'
      - '--set-env-vars=^;^ENVIRONMENT=production;PROJECT_ID=${PROJECT_ID};GOOGLE_CLOUD_PROJECT=${PROJECT_ID};REGION=${_REGION};VERTEX_AI_LOCATION=${_REGION};VERTEX_AI_MODEL=gemini-3.8-flash;VERTEX_AI_EMBEDDING_MODEL=text-embedding-004;BIGQUERY_DATASET=bioinfo_analytics;GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID};CORS_ORIGINS=${_CORS_ORIGINS}'
      - '--set-secrets=DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,NVIDIA_API_KEY=nvidia-api-key:latest,NCBI_EMAIL=ncbi-email:latest,NCBI_API_KEY=ncbi-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest'
    id: 'deploy-cloud-run'

# Substitution variables (can be overridden with --substitutions)
substitutions:
  _SERVICE_NAME: 'bioinfo-backend-api'
  _REGION: 'us-central1'
  _REPOSITORY: 'bioinfo-docker-repo'
  _SQL_INSTANCE: 'bioinfo-db'
  _GOOGLE_CLIENT_ID: '1085233957159-202e530uj9p9qnt45imm6db82dlf4jta.apps.googleusercontent.com'
  _CORS_ORIGINS: 'https://pubmed-assistant.web.app,https://pubmed-assistant.firebaseapp.com,http://localhost:5173'

# Images to push to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'

# Timeout for the entire build
timeout: '1200s'

options:
  # Use higher CPU machine for faster builds
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
