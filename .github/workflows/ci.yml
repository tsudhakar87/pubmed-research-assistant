name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioinfo-backend

    env:
      JWT_SECRET: test-secret-for-ci
      GOOGLE_CLIENT_ID: test-client-id
      DATABASE_URL: ""
      GOOGLE_CLOUD_PROJECT: test-project
      VERTEX_AI_LOCATION: us-central1
      VERTEX_AI_MODEL: gemini-2.5-pro
      VERTEX_AI_EMBEDDING_MODEL: text-embedding-004

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bioinfo-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --tb=short -q

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioinfo-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bioinfo-backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/ --select=E,F,W --ignore=E501

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioinfo-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bioinfo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_API_URL: https://placeholder.run
          VITE_WS_URL: wss://placeholder.run
          VITE_GOOGLE_CLIENT_ID: placeholder
        run: npm run build
